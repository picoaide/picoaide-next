name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    needs: [webadmin]              # go build ./... 需 webadmin/dist 完整产物(go:embed)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/download-artifact@v4
        with:
          name: webadmin-dist
          path: webadmin/
      - run: make test-server
      - run: go build ./...
      - name: cross-compile server binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/picoaide-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -o /tmp/picoaide-arm64 ./cmd/server

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: desktop tests
        run: |
          if [ -f desktop/package.json ]; then
            cd desktop && npm ci && npm test && npm run typecheck && npm run build
          fi

  webadmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: webadmin build
        run: |
          if [ -d webadmin ] && [ -f webadmin/package.json ]; then
            cd webadmin && npm ci && npm run build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: webadmin-dist
          path: webadmin/dist/
          if-no-files-found: ignore

  package-windows:
    runs-on: windows-latest
    needs: [server, desktop, webadmin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: package
        run: |
          cd desktop
          npm ci
          npm test
          npm run typecheck
          npm run build
          npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: picoaide-windows
          path: desktop/dist/*.exe

  package-macos:
    runs-on: macos-latest
    needs: [server, desktop, webadmin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: package
        run: |
          cd desktop
          npm ci
          npm test
          npm run typecheck
          npm run build
          npx electron-builder --mac
      - uses: actions/upload-artifact@v4
        with:
          name: picoaide-macos
          path: desktop/dist/*.dmg
