name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    needs: [webadmin]              # go build ./... 需 webadmin/dist 完整产物(go:embed)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/download-artifact@v8
        with:
          name: webadmin-dist
          path: webadmin/dist/    # artifact 顶层即 webadmin/dist 内容(go:embed dist)
      - run: make test-server
      - run: go build ./...
      - name: cross-compile server binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/picoaide-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -o /tmp/picoaide-arm64 ./cmd/server

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: desktop tests
        run: |
          if [ -f desktop/package.json ]; then
            cd desktop && npm ci && npm test && npm run typecheck && npm run build
          fi

  webadmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: webadmin build
        run: |
          if [ -d webadmin ] && [ -f webadmin/package.json ]; then
            cd webadmin && npm ci && npm run build
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: webadmin-dist
          path: webadmin/dist/
          if-no-files-found: ignore

  package-windows:
    runs-on: windows-latest
    needs: [server, desktop, webadmin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: npm ci
        timeout-minutes: 10
        run: cd desktop && npm ci
      - name: npm test
        timeout-minutes: 10
        run: cd desktop && npm test
      - name: typecheck
        timeout-minutes: 5
        run: cd desktop && npm run typecheck
      - name: build
        timeout-minutes: 10
        run: cd desktop && npm run build
      - name: electron-builder --win
        timeout-minutes: 20
        run: cd desktop && npx electron-builder --win
      - name: launch smoke (no immediate crash)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktop/release/win-unpacked -Filter *.exe -Recurse | Select-Object -First 1
          $userData = Join-Path $env:APPDATA "picoaide-desktop"
          $bootErr = Join-Path $userData "boot-error.log"
          Write-Host "launching $($exe.FullName)"
          function Start-App {
            Remove-Item -Path $bootErr -Force -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe.FullName -PassThru
            Start-Sleep -Seconds 20
            if (Test-Path $bootErr) {
              Write-Host "=== boot-error.log ==="
              Get-Content $bootErr
              Write-Host "=== end ==="
              if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
              return 2
            }
            if ($p.HasExited) { return $p.ExitCode }
            Stop-Process -Id $p.Id -Force
            return 0
          }
          $rc = Start-App
          if ($rc -ne 0) {
            Write-Error "app failed to boot (rc=$rc) — see boot-error.log above"
            exit 1
          }
          # 升级残留回归:home/node_modules junction 指向已消失目录 → 重启必须自愈,不得秒退
          $roots = @($userData, "$env:APPDATA\PicoAide")
          $link = $null
          foreach ($r in $roots) {
            $candidate = Join-Path $r "dsh\node_modules"
            if (Test-Path $candidate) { $link = $candidate; break }
          }
          if ($null -ne $link) {
            Write-Host "corrupting junction: $link"
            # rmdir 只删 junction 链接本身;PowerShell Remove-Item -Recurse 会连目标一起删
            cmd /c rmdir "$link"
            New-Item -ItemType Directory -Path "C:\upgrade-residue" -Force | Out-Null
            New-Item -ItemType Junction -Path $link -Target "C:\upgrade-residue" | Out-Null
            $rc = Start-App
            if ($rc -ne 0) {
              Write-Error "app exited early with code $rc after stale-junction upgrade — self-heal failed"
              exit 1
            }
            Write-Host "app survived stale-junction restart (self-healed)"
          } else {
            Write-Host "WARN: home junction not found, upgrade-residue scenario skipped"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-windows
          path: desktop/release/*.exe

  package-linux:
    runs-on: ubuntu-latest
    needs: [server, desktop, webadmin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: package
        run: |
          cd desktop
          npm ci
          npm test
          npm run typecheck
          npm run build
          npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-linux
          path: desktop/release/*.AppImage

  package-macos:
    runs-on: macos-latest
    needs: [server, desktop, webadmin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: package
        run: |
          cd desktop
          npm ci
          npm test
          npm run typecheck
          npm run build
          npx electron-builder --mac
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-macos
          path: desktop/release/*.dmg
