name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    needs: [webadmin]              # go build ./... 需 webadmin/dist 完整产物(go:embed)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/download-artifact@v8
        with:
          name: webadmin-dist
          path: webadmin/dist/    # artifact 顶层即 webadmin/dist 内容(go:embed dist)
      - run: make test-server
      - run: go build ./...
      - name: cross-compile server binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/picoaide-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -o /tmp/picoaide-arm64 ./cmd/server

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: desktop tests
        run: |
          if [ -f desktop/package.json ]; then
            cd desktop && npm ci && npm test && npm run typecheck && npm run build
          fi

  webadmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: webadmin build
        run: |
          if [ -d webadmin ] && [ -f webadmin/package.json ]; then
            cd webadmin && npm ci && npm run build
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: webadmin-dist
          path: webadmin/dist/
          if-no-files-found: ignore

  package-windows:
    runs-on: windows-latest
    needs: [server, desktop, webadmin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: npm ci
        timeout-minutes: 10
        run: cd desktop && npm ci
      - name: npm test
        timeout-minutes: 10
        run: cd desktop && npm test
      - name: typecheck
        timeout-minutes: 5
        run: cd desktop && npm run typecheck
      - name: build
        timeout-minutes: 10
        run: cd desktop && npm run build
      - name: electron-builder --win
        timeout-minutes: 20
        run: cd desktop && npx electron-builder --win
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-windows
          path: desktop/release/*.exe

  package-linux:
    runs-on: ubuntu-latest
    needs: [server, desktop, webadmin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: package
        run: |
          cd desktop
          npm ci
          npm test
          npm run typecheck
          npm run build
          npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-linux
          path: desktop/release/*.AppImage

  package-macos:
    runs-on: macos-latest
    needs: [server, desktop, webadmin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: package
        run: |
          cd desktop
          npm ci
          npm test
          npm run typecheck
          npm run build
          npx electron-builder --mac
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-macos
          path: desktop/release/*.dmg
